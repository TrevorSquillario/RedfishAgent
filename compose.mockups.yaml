      - LISTENER_DEST=http://redfish-listener:8080/redfish/events
      - ENABLE_ALERTS=True
      - ENABLE_METRICS=False
    volumes:
      - ./redfish-mockup-server/src:/app:cached
      - ~/redfish-mockups/R750_iDRAC_7.20.60.50/redfish:/redfish
      - ~/redfish-mockups/ssl:/certs
    healthcheck:
      disable: true
    restart: "no"
    ports:
      - 8002:443
    networks:
      - redfishagent

  16g:
