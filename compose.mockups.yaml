      - ENABLE_METRICS=False
    volumes:
      - ./redfish-mockup-server/src:/app:cached
      - ~/redfish-mockups/R670_iDRAC_1.20.60.50/redfish:/redfish
      - ~/redfish-mockups/ssl:/certs
    #environment:
    #  - LOG_LEVEL=DEBUG
    healthcheck:
      disable: true
    restart: "no"
    ports:
      - 8004:443
    networks:
      - redfishagent

networks:
  redfishagent:
    driver: bridge