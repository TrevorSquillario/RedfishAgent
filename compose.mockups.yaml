      - ENABLE_METRICS=False
    volumes:
      - ./redfish-mockup-server/src:/app:cached
      - ~/redfish-mockups/R7615_iDRAC_7.20.80.50/redfish:/redfish
      - ~/redfish-mockups/ssl:/certs
    healthcheck:
      disable: true
    restart: "no"
    ports:
      - 8003:443
    networks:
      - redfishagent

  17g:
    build:
      context: .
