services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - agentredfish

  agentredfish:
    build:
      context: .
      dockerfile: agentredfish/Dockerfile
    image: agentredfish/inventory:latest
    container_name: agentredfish
    ports:
      - "8081:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request,sys; urllib.request.urlopen(\"http://127.0.0.1:8000/healthz\")'"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - ./agentredfish/config/config.yaml:/config/config.yaml:ro
      - ./inventory.yaml:/config/inventory.yaml:ro
    environment:
      - LOG_LEVEL=DEBUG
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      #- REDIS_PASSWORD=
      - POSTGRES_DB=agentredfish_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_HOST=pgvector
      - POSTGRES_PORT=5432
      - OPENAI_API_BASE=http://127.0.0.1:8000
      - OPENAI_MODEL=text-embedding-3-small
      - OPENAI_API_KEY=
    networks:
      - agentredfish

  pgvector:
    image: pgvector/pgvector:pg17 # PostgreSQL with pgvector support
    container_name: pgvector
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: agentredfish_db
    ports:
      - "5432:5432"
    volumes:
      - ~/app/pgvector:/var/lib/postgresql/data
      #- ./postgres/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  redfish-listener:
    profiles:
      - redfish-listener
    build:
      context: ./redfish-listener-go
    image: agentredfish/redfish-listener:latest
    container_name: redfish-listener
    ports:
      #- "8443:8443"
      - "8080:8080"
    restart: unless-stopped
    #volumes:
    #  - ~/redfish-mockups/ssl:/certs
    environment:
      - LISTENER_DEST=http://127.0.0.1:8080/redfish/events
      #- LISTENER_DEST=https://127.0.0.1:8443/redfish/events
      #- LISTENER_CERT=/certs/server.crt
      #- LISTENER_KEY=/certs/server.key
      - REDIS_URL=redis://redis:6379
      - INVENTORY_URL=http://inventory:8080/api/v1/targets
    # command: ["python", "src/redfish_listener.py", "-c", "src/config.ini"]
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - agentredfish

  idrac-exporter:
    image: ghcr.io/mrlhansen/idrac_exporter:latest
    container_name: idrac-exporter
    restart: unless-stopped
    environment:
      CONFIG_DEFAULT_USERNAME: user
      CONFIG_DEFAULT_PASSWORD: calvin
      CONFIG_DEFAULT_SCHEME: https
      CONFIG_DEFAULT_PORT: 443
      CONFIG_DEFAULT_USE_BASIC_AUTH: true
    volumes:
      - ./idrac-exporter/config.yaml:/etc/prometheus/idrac.yml:ro
    ports:
      - "9348:9348"
    networks:
      - agentredfish

  # VictoriaMetrics instance, a single process responsible for
  # storing metrics and serve read requests.
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.138.0
    ports:
      - 8428:8428
      - 8089:8089
      - 8089:8089/udp
      - 2003:2003
      - 2003:2003/udp
      - 4242:4242
    #volumes:
    #  - vmdata:/storage
    command:
      - "--storageDataPath=/storage"
      - "--graphiteListenAddr=:2003"
      - "--opentsdbListenAddr=:4242"
      - "--httpListenAddr=:8428"
      - "--influxListenAddr=:8089"
    restart: always
    networks:
      - agentredfish
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8428/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      agentredfish:
        condition: service_healthy

  #  Metrics collector.
  #  It scrapes targets defined in --promscrape.config
  #  And forward them to --remoteWrite.url
  vmagent:
    image: victoriametrics/vmagent:v1.138.0
    ports:
      - 8429:8429
    volumes:
      #- vmagentdata:/vmagentdata
      - ./victoria-metrics/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - "--promscrape.config=/etc/prometheus/prometheus.yml"
      - "--remoteWrite.url=http://victoriametrics:8428/api/v1/write"
    restart: always
    networks:
      - agentredfish
    depends_on:
      - "victoriametrics"

  # vmalert executes alerting and recording rules
  vmalert:
    image: victoriametrics/vmalert:v1.138.0
    depends_on:
      - "victoriametrics"
      - "alertmanager"
    ports:
      - 8880:8880
    volumes:
      - ./victoria-metrics/rules/alerts.yml:/etc/alerts/alerts.yml
      - ./victoria-metrics/rules/alerts-health.yml:/etc/alerts/alerts-health.yml
      - ./victoria-metrics/rules/alerts-vmagent.yml:/etc/alerts/alerts-vmagent.yml
      - ./victoria-metrics/rules/alerts-vmalert.yml:/etc/alerts/alerts-vmalert.yml
      - ./victoria-metrics/rules/alerts-redfish-alerts.yml:/etc/alerts/alerts-redfish-alerts.yml
    command:
      - "--datasource.url=http://victoriametrics:8428/"
      - "--remoteRead.url=http://victoriametrics:8428/"
      - "--remoteWrite.url=http://vmagent:8429/"
      - "--notifier.url=http://alertmanager:9093/"
      - "--rule=/etc/alerts/*.yml"
      # display source of alerts in grafana
      - "--external.url=http://127.0.0.1:3000" #grafana outside container
      - '--external.alert.source=explore?orgId=1&left={"datasource":"VictoriaMetrics","queries":[{"expr":{{.Expr|jsonEscape|queryEscape}},"refId":"A"}],"range":{"from":"{{ .ActiveAt.UnixMilli }}","to":"now"}}'
    restart: always
    networks:
      - agentredfish

  # alertmanager receives alerting notifications from vmalert
  # and distributes them according to --config.file.
  alertmanager:
    image: prom/alertmanager:v0.28.1
    volumes:
      - ./victoria-metrics/alertmanager.yml:/config/alertmanager.yml
    command:
      - "--config.file=/config/alertmanager.yml"
    ports:
      - 9093:9093
    restart: always
    networks:
      - agentredfish

  grafana:
    image: grafana/grafana:12.2.0
    depends_on:
      - "victoriametrics"
    ports:
      - 3000:3000
    restart: always
    environment:
      - GF_PLUGINS_PREINSTALL=yesoreyeram-infinity-datasource
    volumes:
      #- grafanadata:/var/lib/grafana
      - ./grafana/provisioning/datasources/prometheus/single.yml:/etc/grafana/provisioning/datasources/single.yml
      - ./grafana/provisioning/datasources/infinity/single.yml:/etc/grafana/provisioning/datasources/infinity-single.yml
      - ./grafana/provisioning/dashboards_config:/etc/grafana/provisioning/dashboards
      - ./grafana/provisioning/dashboards/victoriametrics.json:/var/lib/grafana/dashboards/vm.json
      - ./grafana/provisioning/dashboards/vmagent.json:/var/lib/grafana/dashboards/vmagent.json
      - ./grafana/provisioning/dashboards/vmalert.json:/var/lib/grafana/dashboards/vmalert.json
      - ./grafana/provisioning/dashboards/alert-statistics.json:/var/lib/grafana/dashboards/alert-statistics.json
      - ./grafana/provisioning/dashboards/metrics-explorer.json:/var/lib/grafana/dashboards/metrics-explorer.json

  # Redfish mockup servers for different iDRAC versions
  14g:
    build:
      context: .
      dockerfile: redfish-mockup-server/Dockerfile
    image: redfish-mockup-server:latest
    container_name: redfish-mockup-14g
    volumes:
      - ~/redfish-mockups/R740xd_iDRAC_7.00.00.174/redfish:/redfish
      - ~/redfish-mockups/ssl:/certs
    healthcheck:
      disable: true
    restart: "no"
    networks:
      - agentredfish

  15g:
    build:
      context: .
      dockerfile: redfish-mockup-server/Dockerfile
    image: redfish-mockup-server:latest
    container_name: redfish-mockup-15g
    volumes:
      - ~/redfish-mockups/R750_iDRAC_7.20.60.50/redfish:/redfish
      - ~/redfish-mockups/ssl:/certs
    healthcheck:
      disable: true
    restart: "no"
    networks:
      - agentredfish

  16g:
    build:
      context: .
      dockerfile: redfish-mockup-server/Dockerfile
    image: redfish-mockup-server:latest
    container_name: redfish-mockup-16g
    volumes:
      - ~/redfish-mockups/R7615_iDRAC_7.20.80.50/redfish:/redfish
      - ~/redfish-mockups/ssl:/certs
    healthcheck:
      disable: true
    restart: "no"
    networks:
      - agentredfish

  17g:
    build:
      context: .
      dockerfile: redfish-mockup-server/Dockerfile
    image: redfish-mockup-server:latest
    container_name: redfish-mockup-17g
    volumes:
      - ~/redfish-mockups/R670_iDRAC_1.20.60.50/redfish:/redfish
      - ~/redfish-mockups/ssl:/certs
    healthcheck:
      disable: true
    restart: "no"
    networks:
      - agentredfish

networks:
  agentredfish:
    driver: bridge