services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - agentfish

  redfish-listener:
    build:
      context: ./redfish-listener-go
    image: agentfish/redfish-listener:latest
    container_name: redfish-listener
    ports:
      #- "8443:8443"
      - "8080:8080"
    restart: unless-stopped
    #volumes:
    #  - ~/redfish-mockups/ssl:/certs
    environment:
      - LISTENER_DEST=http://127.0.0.1:8080/redfish/events
      #- LISTENER_DEST=https://127.0.0.1:8443/redfish/events
      #- LISTENER_CERT=/certs/server.crt
      #- LISTENER_KEY=/certs/server.key
      - REDIS_URL=redis://redis:6379
      - INVENTORY_URL=http://inventory:8080/api/v1/targets
    # command: ["python", "src/redfish_listener.py", "-c", "src/config.ini"]
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - agentfish

  idrac_exporter:
    image: ghcr.io/mrlhansen/idrac_exporter:latest
    restart: unless-stopped
    environment:
      CONFIG_DEFAULT_USERNAME: user
      CONFIG_DEFAULT_PASSWORD: calvin
      CONFIG_DEFAULT_SCHEME: https
      CONFIG_DEFAULT_PORT: 443
      CONFIG_DEFAULT_USE_BASIC_AUTH: true
    volumes:
      - ./idrac-exporter/config.yaml:/etc/prometheus/idrac.yml:ro
    networks:
      - agentfish

  # VictoriaMetrics instance, a single process responsible for
  # storing metrics and serve read requests.
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.138.0
    ports:
      - 8428:8428
      - 8089:8089
      - 8089:8089/udp
      - 2003:2003
      - 2003:2003/udp
      - 4242:4242
    #volumes:
    #  - vmdata:/storage
    command:
      - "--storageDataPath=/storage"
      - "--graphiteListenAddr=:2003"
      - "--opentsdbListenAddr=:4242"
      - "--httpListenAddr=:8428"
      - "--influxListenAddr=:8089"
    restart: always
    networks:
      - agentfish
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8428/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      inventory:
        condition: service_healthy

  #  Metrics collector.
  #  It scrapes targets defined in --promscrape.config
  #  And forward them to --remoteWrite.url
  vmagent:
    image: victoriametrics/vmagent:v1.138.0
    ports:
      - 8429:8429
    volumes:
      #- vmagentdata:/vmagentdata
      - ./victoria-metrics/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - "--promscrape.config=/etc/prometheus/prometheus.yml"
      - "--remoteWrite.url=http://victoriametrics:8428/api/v1/write"
    restart: always
    networks:
      - agentfish
    depends_on:
      victoriametrics:
        condition: service_healthy

  inventory:
    build:
      context: ./inventory
    image: agentfish/inventory:latest
    container_name: inventory
    ports:
      - "8081:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request,sys; urllib.request.urlopen(\"http://127.0.0.1:8080/healthz\")'"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - ./inventory.yaml:/config/inventory.yaml:ro
    networks:
      - agentfish

networks:
  agentfish:
    driver: bridge