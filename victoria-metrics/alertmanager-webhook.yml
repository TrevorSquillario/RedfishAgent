route:
  group_by: ['alertname', 'id', 'instance'] # CRITICAL: Group by ID so each log is a unique event
  group_wait: 5s                            # How long to buffer initial logs
  group_interval: 1m                        # How long to wait before sending NEW logs in a group
  repeat_interval: 24h                      # Don't re-send the SAME log ID for 24 hours
  
  routes:
    - match:
        severity: "critical"
      receiver: webhook-receiver

receivers:
  - name: webhook-receiver
    webhook_configs:
      - url: "http://redfishagent:8000/api/webhook/alerts/prometheus"
        send_resolved: true                 # Sends the "Resolved" state when the log window passes