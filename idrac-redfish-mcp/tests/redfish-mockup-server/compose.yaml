services:
  14g:
    image: dmtf/redfish-mockup-server:latest
    volumes:
      - ~/redfish-mockups/R740xd_iDRAC_7.00.00.174:/mockup
      - ~/redfish-mockups/ssl:/certs
    network_mode: "host"
    healthcheck:
      disable: true
    restart: "no"
    entrypoint: >
     python /usr/src/app/redfishMockupServer.py 
      -H 0.0.0.0 -p 8001
      -D /mockup
      -s --cert /certs/server.crt --key /certs/server.key

