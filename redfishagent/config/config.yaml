plugins:
  inventory:
    - yaml
  output:
    - slack
mcp_servers:
  - http://idrac-redfish-mcp:8080/mcp
  - file:///app/mcp_servers/prometheus.py
prompts:
  redfish_agent:
    main: >
      1. Use the get_error_and_event_registry tool to get details about the alerts.
      2. Get the top 10 lifecycle logs of severity Critical.
      3. Discover the related metrics using the discover_metrics tool, then query them using the get_metric_analysis tool.